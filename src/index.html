<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet" />
  <style>
    body {
      background-color: #2a2540;
      background-image: linear-gradient(180deg, #1f2140 0%, #4a3a5e 55%, #b27a72 100%);
      background-attachment: fixed;
      min-height: 100vh;
      margin: 0;
    }

    #webgl {
      pointer-events: none;
    }

    #ui-app {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    #ui {
      position: absolute;
      overflow: hidden;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    #monitor-videos {
      pointer-events: none;
      position: 'absolute';
      opacity: 0;
      width: 0;
      height: 0;
      top: 0;
      left: 0;

    }

    #css {
      cursor: pointer;
    }

    #ui-interactive {
      position: absolute;
      top: 0;
      left: 0;
      width: 256px;
    }

    video {
      position: absolute;
      top: 0;
      pointer-events: none;
    }
  </style>

  <!-- Primary Meta Tags -->
  <title>Samarjeet Mohite - Portfolio 2026</title>
  <meta name="title" content="Samarjeet Mohite - Software Engineer">
  <meta name="description"
    content="I'm Samarjeet, a Software Engineer based in Bangalore. IIIT Gwalior graduate, currently building AI tutoring products at Fermi AI.">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://samarjeet-portfolio-3d.vercel.app/">
  <meta property="og:title" content="Samarjeet Mohite - Software Engineer">
  <meta property="og:description"
    content="I'm Samarjeet, a Software Engineer based in Bangalore. IIIT Gwalior graduate, currently building AI tutoring products at Fermi AI.">

  <!-- Twitter -->


  <meta property="twitter:card" content="summary_large_image">
  <meta name="twitter:card" content="summary_large_image">

  <meta property="twitter:url" content="https://samarjeet-portfolio-3d.vercel.app/">
  <meta name="twitter:url" content="https://samarjeet-portfolio-3d.vercel.app/">

  <meta property="twitter:title" content="Samarjeet Mohite - Software Engineer">
  <meta name="twitter:title" content="Samarjeet Mohite - Software Engineer">

  <meta property="twitter:description"
    content="I'm Samarjeet, a Software Engineer based in Bangalore. IIIT Gwalior graduate, currently building AI tutoring products at Fermi AI.">
  <meta name="twitter:description"
    content="I'm Samarjeet, a Software Engineer based in Bangalore. IIIT Gwalior graduate, currently building AI tutoring products at Fermi AI.">

  <meta property="twitter:image" content="https://samarjeet-portfolio-3d.vercel.app/images/preview-new.jpg">

  <!-- Images -->
  <meta property="og:image" content="https://samarjeet-portfolio-3d.vercel.app/images/preview-new.jpg">
  <meta property="og:image:secure" content="https://samarjeet-portfolio-3d.vercel.app/images/preview-new.jpg">

  <link rel="shortcut icon" href="../static/images/favicon.ico" type="image/x-icon">
</head>
